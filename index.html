<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Minha Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Minha Lista de Tarefas</h1>
        <p class="subtitle">Organize suas atividades.</p>

        <div id="storage-message" class="notice" role="alert" hidden></div>

        <form id="task-form">
            <label for="task-input" class="field-label">Nova tarefa</label>
            <div class="form-row">
                <input
                    type="text"
                    id="task-input"
                    name="task"
                    placeholder="Digite uma tarefa..."
                    maxlength="100"
                    autocomplete="off"
                    required
                >
                <button type="submit" class="btn-primary">Adicionar</button>
            </div>
        </form>

        <div id="task-filters" role="group" aria-label="Filtrar tarefas">
            <button type="button" class="active" data-filter="all" aria-pressed="true">Todas</button>
            <button type="button" data-filter="pending" aria-pressed="false">Pendentes</button>
            <button type="button" data-filter="completed" aria-pressed="false">Concluídas</button>
        </div>

        <p id="task-counter" class="counter" role="status" aria-atomic="true"></p>

        <ul id="task-list" role="list" aria-label="Lista de tarefas"></ul>
        <p id="task-empty" class="empty-state" hidden></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
